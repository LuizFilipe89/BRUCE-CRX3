; PlatformIO Project Configuration File
;
; Custom board target for a plain ESP32 DevKit V1 + 1.8" SPI TFT (ST7735,
; 128x160, confirmed on real hardware) + 4 physical buttons (K1-K4).
; See dispositivo-display-esp32.pdf for the wiring table (pin assignments
; only - panel size/driver in that PDF was wrong, corrected via testing
; while bringing up ESP32Marauder on the same hardware).
;
; Modeled on boards/marauder-mini (same MCU class: board = esp32dev,
; same ST7735_DRIVER family) since it's the closest existing Bruce target
; to this hardware.

[env:DevKit-Custom]
board = esp32dev
board_build.partitions = custom_4Mb_full.csv
build_src_filter =${env.build_src_filter} +<../boards/devkit-custom>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}

	-Iboards/devkit-custom

	-DUSER_SETUP_LOADED=1
	-DST7735_DRIVER=1
	; BLACKTAB applies NO colstart/rowstart correction at all in this
	; TFT_eSPI fork (checked TFT_Drivers/ST7735_Rotation.h) - the static
	; strip that follows the same physical edge across every rotation we
	; tried is consistent with that missing offset, not a layout bug.
	; GREENTAB2 is a well-documented alternative for these generic 1.8"
	; 128x160 ST7735 panels that actually sets colstart/rowstart.
	-DST7735_GREENTAB2
	-DTFT_RGB_ORDER=TFT_BGR
	; True native (rotation=0) panel size. ROTATION=1 in pins_arduino.h
	; swaps this to a reported 160x128 landscape at runtime, matching
	; Bruce's landscape-only UI assumptions instead of fighting them.
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=160
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=5
	-DTFT_DC=2
	-DTFT_RST=4
	; Backlight is wired straight to 3V3 (no control pin available) -
	; TFT_BL points at a spare, unused GPIO so pinMode()/digitalWrite()
	; in the shared brightness code have a real (if disconnected) pin
	; to operate on instead of an invalid one.
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=10000000
	-DSPI_READ_FREQUENCY=10000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DTOUCH_CS=-1

	-DDEVICE_NAME='"ESP32 DevKit Custom"'

lib_deps =
	${env.lib_deps}

lib_ignore =
	${env_4mb.lib_ignore}
